<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antiverse Arsenal Prototype</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="focus-pending">
  <canvas id="tunnel-background" aria-hidden="true"></canvas>
  <div id="game-container"></div>
  <canvas id="floating-text-overlay" aria-hidden="true"></canvas>
  <div id="custom-cursor" aria-hidden="true">
    <span class="custom-cursor custom-cursor-left"></span>
    <span class="custom-cursor custom-cursor-right"></span>
    <span class="custom-cursor custom-cursor-top"></span>
    <span class="custom-cursor custom-cursor-bottom"></span>
  </div>
  <div id="focus-overlay" aria-labelledby="focus-title">
    <main class="menu-card main-menu-card">
      <h1 id="focus-title"></h1>
      <p id="main-menu-highscore" class="main-menu-highscore"></p>
      <div class="main-menu-actions">
        <button id="start-game-button" class="menu-primary-button" type="button"></button>
        <button id="main-menu-controls-button" type="button"></button>
      </div>
    </main>
  </div>

  <div class="encounter-status">
    <div id="spawn-banner"><span id="spawn-timer">10</span></div>
    <ol id="encounter-timeline" class="encounter-timeline" aria-label="Upcoming encounters">
      <li data-sector="1" data-kind="combat"><span aria-hidden="true"></span>Combat</li>
      <li data-sector="2" data-kind="combat"><span aria-hidden="true"></span>Combat</li>
      <li data-sector="3" data-kind="combat"><span aria-hidden="true"></span>Combat</li>
      <li data-after-sector="3" data-kind="shop"><span aria-hidden="true"></span>Shop</li>
      <li data-sector="4" data-kind="boss"><span aria-hidden="true"></span>Boss</li>
    </ol>
  </div>

  <div id="hud">
    <section class="hud-panel hud-score-panel" aria-label="Score">
      <div id="score" class="hud-row hud-score-primary"><span id="score-label"></span></div>
      <div id="highscore" class="hud-row hud-score-secondary"><span id="highscore-label"></span></div>
      <div id="money" class="hud-row hud-money"><span id="money-label"></span></div>
    </section>

    <section class="hud-panel hud-round-panel" aria-label="Sector information">
      <div id="multiverse" class="hud-row hud-round-primary"><span id="multiverse-label"></span></div>
      <div id="round" class="hud-row"><span id="round-label"></span></div>
      <div id="next-universe" class="hud-row"><span id="next-universe-label"></span></div>
      <div id="incursions" class="hud-row"><span id="incursion-label"></span></div>
      <div id="stability" class="hud-row"><span id="stability-label"></span></div>
    </section>

  </div>

  <section id="player-hud" class="player-hud-panel" aria-label="Player systems HUD">
    <div id="hull" class="player-hud-hull" aria-label="Hull integrity">
      <div class="hull-gauge" id="hull-gauge">
        <div class="hull-gauge-face">
          <div class="hull-gauge-needle" id="hull-gauge-needle"></div>
          <div class="hull-gauge-hub"></div>
        </div>
      </div>
      <div class="hull-readout">
        <span class="hull-readout-title">Hull</span>
        <span id="hull-label"></span>
      </div>
    </div>

    <div class="player-hud-cooldowns" aria-label="Player ability cooldowns">
      <div id="dash" class="ability-cooldown" data-ready="true" aria-label="Dash — Shift">
        <div class="ability-cooldown-ring" id="dash-ring">
          <i class="fa-solid fa-bolt ability-cooldown-icon" aria-hidden="true"></i>
        </div>
        <span class="ability-cooldown-label">Dash</span>
      </div>
      <div id="warp" class="ability-cooldown" data-ready="true" aria-label="Warp — middle mouse button">
        <div class="ability-cooldown-ring" id="warp-ring">
          <i class="fa-solid fa-shuffle ability-cooldown-icon" aria-hidden="true"></i>
        </div>
        <span class="ability-cooldown-label">Warp</span>
      </div>
      <div id="laser" class="ability-cooldown" data-ready="true" aria-label="Laser — Control">
        <div class="ability-cooldown-ring" id="laser-ring">
          <i class="fa-solid fa-crosshairs ability-cooldown-icon" aria-hidden="true"></i>
        </div>
        <span class="ability-cooldown-label">Laser</span>
      </div>
    </div>
  </section>

  <div id="message-overlay" class="hidden">
    <div id="message-text"></div>
  </div>

  <div id="powerup-overlay" class="hidden">
    <div>
      <h2 id="shop-title"></h2>
      <p id="shop-cash" class="shop-cash"></p>
      <p id="shop-subtitle"></p>
      <p id="shop-feedback" class="shop-feedback" aria-live="polite"></p>
      <div id="powerup-options"></div>
      <div class="shop-actions">
        <button id="shop-reroll-button" type="button"></button>
      </div>
      <button id="shop-continue-button" class="shop-skip-button" type="button"></button>
    </div>
  </div>

  <div id="multiverse-complete-overlay" class="hidden">
    <div class="menu-card multiverse-complete-card">
      <h1 id="multiverse-complete-title"></h1>
      <p id="multiverse-complete-wraps"></p>
      <p id="multiverse-complete-cash"></p>
      <button id="multiverse-complete-continue-button" type="button"></button>
    </div>
  </div>

  <div id="pause-overlay" class="hidden">
    <div class="menu-card pause-card">
      <h1 id="pause-title"></h1>
      <button id="resume-button"></button>
      <button id="controls-button"></button>
      <button id="pause-restart-button"></button>
      <button id="quit-button"></button>
    </div>
  </div>

  <div id="controls-panel" class="hidden" role="dialog" aria-modal="true" aria-labelledby="controls-title">
    <div class="menu-card guide-panel-card controls-panel-card">
      <button id="controls-close-button" class="panel-close-button" type="button" aria-label="Close controls">x</button>
      <p id="controls-eyebrow" class="controls-eyebrow"></p>
      <h2 id="controls-title"></h2>
      <p id="controls-body" class="guide-intro"></p>

      <section class="controls-list">
        <div class="control-grid">
          <div class="control-row"><kbd>WASD</kbd><span id="control-move"></span></div>
          <div class="control-row"><kbd>MOUSE</kbd><span id="control-aim"></span></div>
          <div class="control-row"><kbd>SPACE</kbd><span id="control-fire"></span></div>
          <div class="control-row"><kbd>SHIFT</kbd><span id="control-dash"></span></div>
          <div class="control-row"><kbd>MIDDLE MOUSE CLICK</kbd><span id="control-warp"></span></div>
          <div class="control-row"><kbd>LEFT CTRL</kbd><span id="control-laser"></span></div>
          <div class="control-row"><kbd>LEFT CLICK</kbd><span id="control-drag"></span></div>
          <div class="control-row"><kbd>RIGHT CLICK</kbd><span id="control-swap"></span></div>
        </div>
      </section>

      <button id="controls-back-button" class="menu-primary-button" type="button"></button>
    </div>
  </div>

  <div id="gameover-overlay" class="hidden">
    <div class="menu-card gameover-card">
      <h1 id="gameover-title"></h1>
      <div class="gameover-details" aria-label="Run summary">
        <p id="gameover-cause-label" class="gameover-cause"></p>
        <p id="gameover-ability-label" class="gameover-ability"></p>
        <p id="gameover-least-ability-label" class="gameover-ability"></p>
        <p id="final-score-label"></p>
        <p id="final-highscore-label"></p>
        <p id="final-multiverse-label"></p>
        <p id="final-wrap-hits-label"></p>
        <p id="final-highest-wrap-shot-label"></p>
      </div>
      <button id="restart-button"></button>
    </div>
  </div>

  <script src="scripts/game/entities/ship-orbital.js"></script>

  <script src="scripts/game/entities/shotgun-enemy.js"></script>
  <script src="scripts/game/entities/machine-gun-enemy.js"></script>
  <script src="scripts/game/entities/double-shot-enemy.js"></script>
  <script src="scripts/game/entities/sniper-enemy.js"></script>

  <script src="scripts/game/explosion-fx.js"></script>

  <script src="scripts/game/global.js"></script>

  <script>
    (() => {
      const fallbackGameoverText = {
        title: 'GAME OVER!',
        destroyedBy: 'DESTROYED BY:',
        mostUsed: 'MOST USED:',
        leastUsed: 'LEAST USED:',
        yourScore: 'YOUR SCORE:',
        highScore: 'HIGH SCORE:',
        multiverse: 'MULTIVERSE:',
        wrapHits: 'WRAP HITS:',
        highestWrapShot: 'HIGHEST WRAP SHOT:'
      };

      const title = document.getElementById('gameover-title');
      const mostAbility = document.getElementById('gameover-ability-label');
      const leastAbility = document.getElementById('gameover-least-ability-label');
      const card = document.querySelector('.gameover-card');

      if (!title || !mostAbility || !leastAbility || !card) return;

      let gameoverText = fallbackGameoverText;
      let applying = false;

      const makeFormattedLine = (label, value) => {
        const prefix = document.createElement('span');
        prefix.className = 'gameover-label-prefix';
        prefix.textContent = label;
        return [prefix, document.createTextNode(value ? ` ${value}` : '')];
      };

      const readValueAfterColon = (text) => {
        const match = String(text || '').trim().match(/^[^:]+:\s*(.*)$/s);
        return match ? match[1].trim() : String(text || '').trim();
      };

      const parseAbilitySummary = (text) => {
        const source = String(text || '').replace(/\s+/g, ' ').trim();
        if (!source) return null;

        const mostMatch = source.match(/MOST\s+USED\s*:\s*(.*?)(?=\s*(?:[|•/—–]\s*)?LEAST\s+USED\s*:|$)/i);
        const leastMatch = source.match(/LEAST\s+USED\s*:\s*(.*)$/i);
        if (!mostMatch && !leastMatch) return null;

        return {
          most: mostMatch ? mostMatch[1].replace(/\s*[|•/—–]\s*$/, '').trim() : '',
          least: leastMatch ? leastMatch[1].trim() : ''
        };
      };

      const formatKnownLine = (id, label) => {
        const element = document.getElementById(id);
        if (!element) return;
        const value = readValueAfterColon(element.textContent);
        if (!value && !element.textContent.trim()) return;
        element.replaceChildren(...makeFormattedLine(label, value));
      };

      const refreshGameoverCopy = () => {
        if (applying) return;
        applying = true;
        observer.disconnect();

        try {
          title.textContent = gameoverText.title;

          formatKnownLine('gameover-cause-label', gameoverText.destroyedBy);
          formatKnownLine('final-score-label', gameoverText.yourScore);
          formatKnownLine('final-highscore-label', gameoverText.highScore);
          formatKnownLine('final-multiverse-label', gameoverText.multiverse);
          formatKnownLine('final-wrap-hits-label', gameoverText.wrapHits);
          formatKnownLine('final-highest-wrap-shot-label', gameoverText.highestWrapShot);

          const combined = parseAbilitySummary(mostAbility.textContent);
          if (combined && combined.least) {
            mostAbility.replaceChildren(...makeFormattedLine(gameoverText.mostUsed, combined.most));
            leastAbility.replaceChildren(...makeFormattedLine(gameoverText.leastUsed, combined.least));
          } else {
            const mostValue = readValueAfterColon(mostAbility.textContent);
            const leastValue = readValueAfterColon(leastAbility.textContent);
            if (mostValue) mostAbility.replaceChildren(...makeFormattedLine(gameoverText.mostUsed, mostValue));
            if (leastValue) leastAbility.replaceChildren(...makeFormattedLine(gameoverText.leastUsed, leastValue));
          }
        } finally {
          applying = false;
          observer.observe(card, { subtree: true, childList: true, characterData: true });
        }
      };

      const observer = new MutationObserver(refreshGameoverCopy);
      observer.observe(card, { subtree: true, childList: true, characterData: true });

      fetch('text.json')
        .then((response) => response.ok ? response.json() : Promise.reject(new Error(`HTTP ${response.status}`)))
        .then((localization) => {
          if (!localization) return;

          const labelFromTemplate = (key, fallback) => {
            const template = localization[key];
            if (typeof template !== 'string') return fallback;
            const placeholderIndex = template.indexOf('%');
            const label = (placeholderIndex >= 0 ? template.slice(0, placeholderIndex) : template).trim();
            return label || fallback;
          };

          gameoverText = {
            ...fallbackGameoverText,
            title: localization['gameover.title'] || fallbackGameoverText.title,
            destroyedBy: labelFromTemplate('gameover.destroyedBy', fallbackGameoverText.destroyedBy),
            mostUsed: labelFromTemplate('gameover.mostUsed', fallbackGameoverText.mostUsed),
            leastUsed: labelFromTemplate('gameover.leastUsed', fallbackGameoverText.leastUsed),
            yourScore: labelFromTemplate('gameover.score', fallbackGameoverText.yourScore),
            highScore: labelFromTemplate('gameover.highscore', fallbackGameoverText.highScore),
            multiverse: labelFromTemplate('gameover.multiverse', fallbackGameoverText.multiverse),
            wrapHits: labelFromTemplate('gameover.wrapHits', fallbackGameoverText.wrapHits),
            highestWrapShot: labelFromTemplate('gameover.highestWrapShot', fallbackGameoverText.highestWrapShot)
          };
        })
        .catch(() => {})
        .finally(refreshGameoverCopy);
    })();
  </script>
</body>
